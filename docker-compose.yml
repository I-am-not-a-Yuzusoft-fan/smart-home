# 项目名显式写死：目录名含中文，compose 自动推导会得到空名而报错。
name: smarthome

services:
  db:
    image: postgres:17-alpine
    container_name: smarthome-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: spike
      POSTGRES_DB: smarthome
    ports:
      # 宿主机 5433：避免与本机已有的 5432 上的 PostgreSQL 抢端口
      - "5433:5432"
    volumes:
      - smarthome-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smarthome"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  smarthome-pgdata:
