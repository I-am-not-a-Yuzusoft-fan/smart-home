version: "2"
sql:
  # 全部迁移按顺序喂给 sqlc：加一版就往这里补一个文件名（0001 建表、0002 墙面挂件）。
  - schema:
      - "sql/0001_init.sql"
      - "sql/0002_mount_and_openings.sql"
      - "sql/0003_underlay.sql"
      - "sql/0004_wall_arc.sql"
      - "sql/0005_arc_half_circle.sql"
      - "sql/0006_wall_pair_arc.sql"
      - "sql/0007_room_kind_balcony.sql"
    queries: "sql/queries"
    engine: "postgresql"
    gen:
      go:
        package: "store"
        out: "backend/store/gen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: false
        overrides:
          # sqlc v1.31 默认把 jsonb 映射为 []byte，且 nullable 与非 nullable 分开判定。
          # 两条规则缺一不可，否则 nullable 列静默退回 []byte（V5 实测）。
          - db_type: "jsonb"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - db_type: "jsonb"
            nullable: true
            go_type:
              import: "encoding/json"
              type: "RawMessage"
