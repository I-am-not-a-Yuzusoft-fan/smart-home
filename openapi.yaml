openapi: 3.1.0
info:
  title: Smart Home API
  version: 0.1.0
  description: |
    智能家居系统的 HTTP 契约。这是**唯一来源**：Go 服务端与 TypeScript 客户端都由它生成，
    禁止手改生成物。契约随票增长——本版只覆盖 T1（骨架）用到的接口，后续票逐条补齐。
servers:
  - url: http://localhost:8081
    description: 本机开发（前端经 Vite 代理访问）
paths:
  /api/healthz:
    get:
      operationId: healthz
      summary: 健康检查
      description: 供启动脚本与容器探活用，不鉴权、不读库。
      security: []
      responses:
        "200":
          description: 服务在跑
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status:
                    type: string
                    const: ok
                  version:
                    type: string
                    example: 0.1.0
  /api/auth/login:
    post:
      operationId: login
      summary: 用账号密码换取会话 Cookie
      description: |
        成功后设置 `session` Cookie（httpOnly、SameSite=Lax）。口令错误与用户不存在返回同一个
        401，避免枚举账号。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/auth/logout:
    post:
      # 退出不需要已有会话：浏览器丢了 Cookie 时也应能清干净
      security: []
      operationId: logout
      summary: 清除会话
      description: 服务端把 Cookie 置空并立即过期；重复调用无副作用。
      responses:
        "204":
          description: 已退出
  /api/auth/me:
    get:
      operationId: me
      summary: 取当前会话的用户
      description: 前端启动时用它判断是否已登录。
      responses:
        "200":
          description: 已登录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/plan:
    get:
      operationId: getPlan
      summary: 取当前户型（端点与墙）
      description: |
        平面图第一笔数据。端点单独返回而不是内嵌在墙里，是因为两面墙共用一个端点——
        房间推导（T3）要靠这个共享关系绕环，坐标重复的话会变成两套端点。

        `corners` 可能包含没有任何墙引用的**孤立端点**（删墙不删端点），调用方在渲染与
        吸附时应只认被 `walls` 引用到的端点，否则会吸到看不见的点上。
      responses:
        "200":
          description: 户型
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/walls:
    post:
      operationId: createWall
      summary: 画一面墙
      description: |
        端点按坐标落库：已存在就复用（`corner` 上 `(x, y)` 唯一），不存在就新建。
        同一对端点只允许一面墙，反着画（B→A）也是同一面墙，返回已有那面。
        成功后返回**整个户型**，前端直接替换本地状态，不必再发一次 GET。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WallInput"
      responses:
        "201":
          description: 已创建（或已存在同一面墙）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/walls/{wallId}:
    delete:
      operationId: deleteWall
      summary: 删除一面墙
      description: |
        只删墙，不删端点——端点可能被其他墙共用，成为孤立端点也是合法状态。
        重复删除返回 404（后端不做幂等处理），调用方应把 404 当作"已经没了"。
      parameters:
        - name: wallId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: 已删除
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: 没有这面墙
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: |
        HMAC 签名的不透明会话 Cookie。`httpOnly` + `SameSite=Lax` + `Path=/`，
        前端拿不到也不需要拿它的内容。实时通道复用同一个 Cookie。
  responses:
    Unauthenticated:
      description: 未登录或会话无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidRequest:
      description: 请求体不合法
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          examples: [zhang]
        password:
          type: string
          minLength: 1
          maxLength: 256
    SessionUser:
      type: object
      required: [id, username, displayName, role]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [admin, member]
    WallInput:
      type: object
      required: [ax, ay, bx, by]
      additionalProperties: false
      properties:
        ax:
          type: number
          format: double
          minimum: 0
          maximum: 5000
          description: 起点 x，单位厘米，原点在平面图左上角（0–5000，超出会被拒）
        ay:
          type: number
          format: double
          minimum: 0
          maximum: 5000
        bx:
          type: number
          format: double
          minimum: 0
          maximum: 5000
          description: 终点 x（0–5000，超出会被拒）
        by:
          type: number
          format: double
          minimum: 0
          maximum: 5000
        thickness:
          type: number
          format: double
          minimum: 1
          maximum: 100
          default: 10
          description: 墙厚（厘米），省略时为 10
    Corner:
      type: object
      required: [id, x, y]
      properties:
        id:
          type: string
          format: uuid
        x:
          type: number
          format: double
        y:
          type: number
          format: double
    Wall:
      type: object
      required: [id, aId, bId, ax, ay, bx, by, thickness]
      properties:
        id:
          type: string
          format: uuid
        aId:
          type: string
          format: uuid
          description: 起点端点 id
        bId:
          type: string
          format: uuid
        ax:
          type: number
          format: double
        ay:
          type: number
          format: double
        bx:
          type: number
          format: double
        by:
          type: number
          format: double
        thickness:
          type: number
          format: double
    Plan:
      type: object
      required: [corners, walls]
      properties:
        corners:
          type: array
          items:
            $ref: "#/components/schemas/Corner"
        walls:
          type: array
          items:
            $ref: "#/components/schemas/Wall"
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: |
                机器可读的错误码。本版只用到前三个，其余是后续票的预留：
                UNAUTHENTICATED、VALIDATION_FAILED、INTERNAL、
                FORBIDDEN、NOT_FOUND、RANGE_OUT_OF_BOUNDS、CONFIRMATION_REQUIRED、
                CONFLICT、ROOM_NOT_CLOSED、DEVICE_UNAVAILABLE、DEVICE_TIMEOUT、
                IMPORT_VALIDATION_FAILED
              enum:
                - UNAUTHENTICATED
                - VALIDATION_FAILED
                - INTERNAL
                - FORBIDDEN
                - NOT_FOUND
                - RANGE_OUT_OF_BOUNDS
                - CONFIRMATION_REQUIRED
                - CONFLICT
                - ROOM_NOT_CLOSED
                - DEVICE_UNAVAILABLE
                - DEVICE_TIMEOUT
                - IMPORT_VALIDATION_FAILED
            message:
              type: string
security:
  - cookieAuth: []
