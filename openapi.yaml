openapi: 3.1.0
info:
  title: Smart Home API
  version: 0.1.0
  description: |
    智能家居系统的 HTTP 契约。这是**唯一来源**：Go 服务端与 TypeScript 客户端都由它生成，
    禁止手改生成物。契约随票增长——本版覆盖 T1–T3 与 T6 用到的接口，后续票逐条补齐。
servers:
  - url: http://localhost:8081
    description: 本机开发（前端经 Vite 代理访问）
paths:
  /api/healthz:
    get:
      operationId: healthz
      summary: 健康检查
      description: 供启动脚本与容器探活用，不鉴权、不读库。
      security: []
      responses:
        "200":
          description: 服务在跑
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status:
                    type: string
                    const: ok
                  version:
                    type: string
                    example: 0.1.0
  /api/auth/login:
    post:
      operationId: login
      summary: 用账号密码换取会话 Cookie
      description: |
        成功后设置 `session` Cookie（httpOnly、SameSite=Lax）。口令错误与用户不存在返回同一个
        401，避免枚举账号。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/auth/logout:
    post:
      # 退出不需要已有会话：浏览器丢了 Cookie 时也应能清干净
      security: []
      operationId: logout
      summary: 清除会话
      description: 服务端把 Cookie 置空并立即过期；重复调用无副作用。
      responses:
        "204":
          description: 已退出
  /api/auth/me:
    get:
      operationId: me
      summary: 取当前会话的用户
      description: 前端启动时用它判断是否已登录。
      responses:
        "200":
          description: 已登录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/plan:
    get:
      operationId: getPlan
      summary: 取当前户型（端点与墙）
      description: |
        平面图第一笔数据。端点单独返回而不是内嵌在墙里，是因为两面墙共用一个端点——
        房间推导（T3）要靠这个共享关系绕环，坐标重复的话会变成两套端点。

        `corners` 可能包含没有任何墙引用的**孤立端点**（删墙不删端点），调用方在渲染与
        吸附时应只认被 `walls` 引用到的端点，否则会吸到看不见的点上。
      responses:
        "200":
          description: 户型
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/walls:
    post:
      operationId: createWall
      summary: 画一面墙
      description: |
        端点按坐标落库：已存在就复用（`corner` 上 `(x, y)` 唯一），不存在就新建。
        同一对端点只允许一面墙，反着画（B→A）也是同一面墙，返回已有那面。
        成功后返回**整个户型**，前端直接替换本地状态，不必再发一次 GET。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WallInput"
      responses:
        "201":
          description: 已创建（或已存在同一面墙）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/walls/{wallId}:
    delete:
      operationId: deleteWall
      summary: 删除一面墙
      description: |
        只删墙，不删端点——端点可能被其他墙共用，成为孤立端点也是合法状态。
        重复删除返回 404（后端不做幂等处理），调用方应把 404 当作"已经没了"。
      parameters:
        - name: wallId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: 已删除
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: 没有这面墙
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/item-types:
    get:
      operationId: listItemTypes
      summary: 列出全部类型模板
      description: |
        返回内置类型与用户新建的类型。能力元数据（`capabilities`）是前端动态表单、
        后端校验、模拟器行为与图标映射的唯一来源。
      responses:
        "200":
          description: 类型模板列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ItemType"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: createItemType
      summary: 新建类型模板（仅管理员）
      description: |
        `key` 是类型的稳定身份，创建后不得重命名。能力项的值域在应用层按元数据校验，
        不写入数据库 CHECK 约束——新增类型不应改表。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemTypeInput"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemType"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/item-types/{key}:
    patch:
      operationId: updateItemType
      summary: 修改类型模板（仅管理员）
      description: |
        `key` 不可修改。只修改 `capabilities` 的结构时，服务端递增 `capabilitiesVersion`。
        `driver` 传空字符串表示清除；省略表示保持不变。
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemTypeUpdate"
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemType"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteItemType
      summary: 删除类型模板（仅管理员）
      description: 仍被物品引用的类型不允许删除，返回 409 并说明引用数量。
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: 已删除
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/items:
    get:
      operationId: listItems
      summary: 列出物品（可按房间、类别、关键字筛选）
      parameters:
        - name: room
          in: query
          required: false
          schema:
            type: string
          description: 房间多边形哈希（来自 /api/plan 的 rooms[].hash）
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [furniture, device]
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: 按名称关键字搜索（不区分大小写）
      responses:
        "200":
          description: 物品列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Item"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: createItem
      summary: 新建物品（家具或设备）
      description: |
        设备会按类型模板的 capabilities 初始化 capability_state；这是物品创建事务的一部分，
        不经过命令链路。房间哈希必须来自当前已命名的房间。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemInput"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/items/{id}:
    patch:
      operationId: updateItem
      summary: 修改物品名称、房间、坐标、旋转或装饰属性
      description: 只更新请求里出现的字段；`roomHash` 传空字符串表示移出房间。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemUpdate"
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteItem
      summary: 删除物品
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: 已删除
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: |
        HMAC 签名的不透明会话 Cookie。`httpOnly` + `SameSite=Lax` + `Path=/`，
        前端拿不到也不需要拿它的内容。实时通道复用同一个 Cookie。
  responses:
    Unauthenticated:
      description: 未登录或会话无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidRequest:
      description: 请求体不合法
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: 当前账号无此权限
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: 目标不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: 与现有数据冲突（key 重复、类型仍被引用等）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          examples: [zhang]
        password:
          type: string
          minLength: 1
          maxLength: 256
    SessionUser:
      type: object
      required: [id, username, displayName, role]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [admin, member]
    WallInput:
      type: object
      required: [ax, ay, bx, by]
      additionalProperties: false
      properties:
        ax:
          type: number
          format: double
          minimum: 0
          maximum: 5000
          description: 起点 x，单位厘米，原点在平面图左上角（0–5000，超出会被拒）
        ay:
          type: number
          format: double
          minimum: 0
          maximum: 5000
        bx:
          type: number
          format: double
          minimum: 0
          maximum: 5000
          description: 终点 x（0–5000，超出会被拒）
        by:
          type: number
          format: double
          minimum: 0
          maximum: 5000
        thickness:
          type: number
          format: double
          minimum: 1
          maximum: 100
          default: 10
          description: 墙厚（厘米），省略时为 10
    Corner:
      type: object
      required: [id, x, y]
      properties:
        id:
          type: string
          format: uuid
        x:
          type: number
          format: double
        y:
          type: number
          format: double
    Wall:
      type: object
      required: [id, aId, bId, ax, ay, bx, by, thickness]
      properties:
        id:
          type: string
          format: uuid
        aId:
          type: string
          format: uuid
          description: 起点端点 id
        bId:
          type: string
          format: uuid
        ax:
          type: number
          format: double
        ay:
          type: number
          format: double
        bx:
          type: number
          format: double
        by:
          type: number
          format: double
        thickness:
          type: number
          format: double
    Plan:
      type: object
      required: [corners, walls, rooms, openWalls]
      properties:
        corners:
          type: array
          items:
            $ref: "#/components/schemas/Corner"
        walls:
          type: array
          items:
            $ref: "#/components/schemas/Wall"
        rooms:
          type: array
          description: |
            由墙的闭环推导出来的房间。前端只渲染，不自己推导。
            墙没围成闭环时这里是空数组，`openWalls` 会给出提示依据。
          items:
            $ref: "#/components/schemas/Room"
        openWalls:
          type: integer
          description: 没有参与任何闭合区域的墙数；大于 0 时前端提示「还有墙没围上」
    PlanPoint:
      type: object
      required: [x, y]
      additionalProperties: false
      properties:
        x:
          type: number
          format: double
        y:
          type: number
          format: double
    Room:
      type: object
      required: [hash, ring, areaM2]
      additionalProperties: false
      description: |
        由墙的闭环推导出来的房间。几何不落库，只把多边形的哈希当作身份：
        墙一改，哈希就变，挂在旧哈希上的名字自然失配（不会把「客厅」挂到卫生间上）。
      properties:
        hash:
          type: string
          description: 多边形顶点规范化后的哈希，房间命名的键
        ring:
          type: array
          description: 闭合多边形的顶点，首尾不重复
          items:
            $ref: "#/components/schemas/PlanPoint"
        areaM2:
          type: number
          format: double
          description: 面积（平方米，两位小数）
        name:
          type: string
          description: 用户起的名字；还没起名时为空
        kind:
          type: string
          enum: [living, bedroom, kitchen, bathroom, study, hallway]
          description: 房间用途；还没指定时为空
    CapabilityOption:
      type: object
      required: [value, label]
      additionalProperties: false
      properties:
        value:
          type: string
          description: 存进能力值里的机器标识，如 cool
        label:
          type: string
          description: 界面显示的中文名，如 制冷
    Capability:
      type: object
      required: [key, name, type, writable, history]
      additionalProperties: false
      description: |
        能力项是类型级定义，不是实例值。值域校验读这里，不写数据库 CHECK。
      properties:
        key:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,63}$"
          description: 稳定标识，发布后不得重命名
        name:
          type: string
          minLength: 1
          maxLength: 64
        type:
          type: string
          enum: [bool, number, enum, string]
        unit:
          type: string
          description: 单位，如 %、℃、K
        min:
          type: number
          format: double
        max:
          type: number
          format: double
        step:
          type: number
          format: double
          description: 数值步长；省略表示不限制
        options:
          type: array
          description: type=enum 时必填，且不能为空
          items:
            $ref: "#/components/schemas/CapabilityOption"
        writable:
          type: boolean
          description: 用户是否可以下发命令修改
        default:
          description: 默认值；JSON 标量（boolean/number/string），类型必须与 type 一致，枚举必须命中 options
        history:
          type: boolean
          description: 值变化时是否写 state_history
    ItemType:
      type: object
      required: [key, kind, name, defaultWidth, defaultDepth, capabilities, capabilitiesVersion]
      additionalProperties: false
      properties:
        key:
          type: string
          description: 稳定标识，创建后不可重命名
        kind:
          type: string
          enum: [furniture, device]
        name:
          type: string
        icons:
          type: string
          description: 图标名（Lucide 命名空间内）；没有图标时该字段不出现（null）
        defaultWidth:
          type: number
          format: double
          description: 平面图默认宽度（厘米）
        defaultDepth:
          type: number
          format: double
          description: 平面图默认深度（厘米）
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/Capability"
        capabilitiesVersion:
          type: integer
          description: 能力结构版本；capabilities 结构变化时由服务端递增
        driver:
          type: string
          description: 仅 device 可填；指向设备层适配器
    ItemTypeInput:
      type: object
      required: [key, kind, name, capabilities]
      additionalProperties: false
      properties:
        key:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,63}$"
        kind:
          type: string
          enum: [furniture, device]
        name:
          type: string
          minLength: 1
          maxLength: 64
        icons:
          type: string
          description: 图标名（Lucide 命名空间内）；空串与不填等价，表示没有图标
        defaultWidth:
          type: number
          format: double
          minimum: 1
          maximum: 5000
        defaultDepth:
          type: number
          format: double
          minimum: 1
          maximum: 5000
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/Capability"
        driver:
          type: string
    ItemTypeUpdate:
      type: object
      additionalProperties: false
      description: 所有字段可选；capabilities 省略表示不修改能力结构。
      if:
        required: [capabilities]
      then:
        required: [capabilitiesVersion]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        icons:
          type: string
          description: 图标名（Lucide 命名空间内）；空串与不填等价，表示没有图标
        defaultWidth:
          type: number
          format: double
          minimum: 1
          maximum: 5000
        defaultDepth:
          type: number
          format: double
          minimum: 1
          maximum: 5000
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/Capability"
        driver:
          type: string
          description: 省略表示不变；空字符串表示清除
        capabilitiesVersion:
          type: integer
          description: |
            乐观锁版本。修改 `capabilities` 时**必填**（否则 400）；服务端发现已被他人修改时返回 409。
            UI 保存时总是带上，避免用陈旧的能力数组覆盖别人刚加的能力项。
    Item:
      type: object
      required: [id, typeKey, kind, name, x, y, rotation]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        typeKey:
          type: string
        kind:
          type: string
          enum: [furniture, device]
        name:
          type: string
        roomHash:
          type: string
          description: 所属房间的多边形哈希；未分配时省略
        roomName:
          type: string
          description: 房间显示名；房间还没有命名时省略
        x:
          type: number
          format: double
          description: 平面坐标（厘米）
        y:
          type: number
          format: double
        rotation:
          type: number
          format: double
          description: 旋转角度（度）
        status:
          type: string
          enum: [normal, idle, maintenance]
          description: 仅家具使用；设备状态在 capability_state
        attrs:
          type: object
          additionalProperties: true
    ItemInput:
      type: object
      required: [typeKey, name, x, y]
      additionalProperties: false
      properties:
        typeKey:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 64
        roomHash:
          type: string
          description: 仅允许当前已命名的房间
        x:
          type: number
          format: double
          minimum: 0
          maximum: 5000
        y:
          type: number
          format: double
          minimum: 0
          maximum: 5000
        rotation:
          type: number
          format: double
        status:
          type: string
          enum: [normal, idle, maintenance]
        attrs:
          type: object
          additionalProperties: true
    ItemUpdate:
      type: object
      additionalProperties: false
      description: 只更新出现的字段；roomHash 传空字符串表示移出房间。
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        roomHash:
          type: string
        x:
          type: number
          format: double
          minimum: 0
          maximum: 5000
        y:
          type: number
          format: double
          minimum: 0
          maximum: 5000
        rotation:
          type: number
          format: double
        status:
          type: string
          enum: [normal, idle, maintenance]
        attrs:
          type: object
          additionalProperties: true
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: |
                机器可读的错误码。本版只用到前三个，其余是后续票的预留：
                UNAUTHENTICATED、VALIDATION_FAILED、INTERNAL、
                FORBIDDEN、NOT_FOUND、RANGE_OUT_OF_BOUNDS、CONFIRMATION_REQUIRED、
                CONFLICT、ROOM_NOT_CLOSED、DEVICE_UNAVAILABLE、DEVICE_TIMEOUT、
                IMPORT_VALIDATION_FAILED
              enum:
                - UNAUTHENTICATED
                - VALIDATION_FAILED
                - INTERNAL
                - FORBIDDEN
                - NOT_FOUND
                - RANGE_OUT_OF_BOUNDS
                - CONFIRMATION_REQUIRED
                - CONFLICT
                - ROOM_NOT_CLOSED
                - DEVICE_UNAVAILABLE
                - DEVICE_TIMEOUT
                - IMPORT_VALIDATION_FAILED
            message:
              type: string
security:
  - cookieAuth: []
