openapi: 3.1.0
info:
  title: Smart Home API
  version: 0.1.0
  description: |
    智能家居系统的 HTTP 契约。这是**唯一来源**：Go 服务端与 TypeScript 客户端都由它生成，
    禁止手改生成物。契约随票增长——本版覆盖 T1–T3 与 T6 用到的接口，后续票逐条补齐。
servers:
  - url: http://localhost:8081
    description: 本机开发（前端经 Vite 代理访问）
paths:
  /api/healthz:
    get:
      operationId: healthz
      summary: 健康检查
      description: 供启动脚本与容器探活用，不鉴权、不读库。
      security: []
      responses:
        "200":
          description: 服务在跑
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status:
                    type: string
                    const: ok
                  version:
                    type: string
                    example: 0.1.0
  /api/auth/login:
    post:
      operationId: login
      summary: 用账号密码换取会话 Cookie
      description: |
        成功后设置 `session` Cookie（httpOnly、SameSite=Lax）。口令错误与用户不存在返回同一个
        401，避免枚举账号。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/auth/logout:
    post:
      # 退出不需要已有会话：浏览器丢了 Cookie 时也应能清干净
      security: []
      operationId: logout
      summary: 清除会话
      description: 服务端把 Cookie 置空并立即过期；重复调用无副作用。
      responses:
        "204":
          description: 已退出
  /api/auth/me:
    get:
      operationId: me
      summary: 取当前会话的用户
      description: 前端启动时用它判断是否已登录。
      responses:
        "200":
          description: 已登录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/plan:
    get:
      operationId: getPlan
      summary: 取当前户型（端点与墙）
      description: |
        平面图第一笔数据。端点单独返回而不是内嵌在墙里，是因为两面墙共用一个端点——
        房间推导（T3）要靠这个共享关系绕环，坐标重复的话会变成两套端点。

        `corners` 可能包含没有任何墙引用的**孤立端点**（删墙不删端点），调用方在渲染与
        吸附时应只认被 `walls` 引用到的端点，否则会吸到看不见的点上。
      responses:
        "200":
          description: 户型
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    put:
      operationId: replacePlan
      summary: 整份替换户型（撤销/重做）
      description: |
        撤销/重做不重放操作，而是把整份墙列表写回：墙的 id 由服务端生成，
        删了再建会换 id，门窗的 `wall_id` 就断了。所以这里是「按 id 对齐」的整份替换——
        列表里的 id 表示保留并更新，缺的 id 删除，没有 id 的插入。

        `version` 对不上说明别处已经改过，返回 409；客户端应重新 GET 而不是覆盖。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanInput"
      responses:
        "200":
          description: 替换后的户型
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          description: 版本号过期，别处已改过
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/plan/underlay:
    put:
      operationId: uploadUnderlay
      summary: 上传底图（整张替换）
      description: |
        请求体是**图片原始字节**（`application/octet-stream`，不是 base64、不是 multipart）。
        服务端按魔数判定真实类型，只接受 PNG / JPEG / WebP，单张不超过 5 MiB、
        任一边像素不超过 8000。上传成功会重置定标参数与显示选项（比例按铺满户型包围盒算），
        并清空前端撤销栈——换图是一次硬操作。

        只有管理员能上传。图片字节之后用 `GET /api/plan/underlay/image` 取回，
        按存储时的 content type 原样返回，前端直接当 `<img>` / canvas 的图源。
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: 上传后的户型（含新的底图元数据）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      operationId: updateUnderlay
      summary: 改底图的定标与显示参数
      description: |
        只改元数据，不动图片字节。未出现的字段保持不变——前端拖一次透明度不必回传整份参数。
        旋转只接受 90 的整数倍；比例必须大于 0。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnderlayPatch"
      responses:
        "200":
          description: 改完的户型
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: clearUnderlay
      summary: 删除底图（连图片字节）
      responses:
        "204":
          description: 已删除；本来就没有也返回 204（幂等）
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/walls:
    post:
      operationId: createWall
      summary: 画一面墙
      description: |
        端点按坐标落库：已存在就复用（`corner` 上 `(x, y)` 唯一），不存在就新建。
        同一对端点只允许一面墙，反着画（B→A）也是同一面墙，返回已有那面。
        成功后返回**整个户型**，前端直接替换本地状态，不必再发一次 GET。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WallInput"
      responses:
        "201":
          description: 已创建（或已存在同一面墙）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/walls/{wallId}:
    patch:
      operationId: updateWall
      summary: 改一面墙的端点或厚度
      description: |
        用于拖端点微调长度与角度。端点同样按坐标落库（已存在就复用），
        所以把端点拖到另一面墙的端点上是"合并到那个点"，不是新建一个重合点。
        改完不再被任何墙引用的端点会被清掉。
        若改完与另一面已有墙完全重合（同一对端点），返回 409，不悄悄合并两面墙。
      parameters:
        - name: wallId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WallInput"
      responses:
        "200":
          description: 已更新，返回整个户型
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: 没有这面墙
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 改完会和另一面墙重合成同一对端点
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteWall
      summary: 删除一面墙
      description: |
        删掉这面墙，并清理因此不再被任何墙引用的端点（共用端点会保留）。
        重复删除返回 404（后端不做幂等处理），调用方应把 404 当作"已经没了"。
      parameters:
        - name: wallId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: 已删除
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: 没有这面墙
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/rooms/{hash}:
    parameters:
      - name: hash
        in: path
        required: true
        description: 房间多边形的哈希（由墙推导，16 位十六进制）
        schema:
          type: string
          pattern: "^[0-9a-f]{16}$"
    patch:
      operationId: updateRoomName
      summary: 给房间起名或改用途
      description: |
        房间几何由墙推导，库里只存名字与用途。`hash` 必须是当前户型里存在的房间；
        墙改过之后哈希会变，旧名字会出现在 `Plan.staleRooms` 里，需要重新命名或清理。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomNameInput"
      responses:
        "200":
          description: 已保存，返回最新的整份户型
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: 这个哈希不属于当前户型的任何房间
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: clearRoomName
      summary: 清掉房间名
      description: |
        只删名字，不动几何。幂等：本来就没有名字、或者这个哈希已经失配
        （墙改过之后旧名字还留在 `Plan.staleRooms` 里），都返回 204——
        「清理失配名字」正是前端要的能力。
      responses:
        "204":
          description: 已清除
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/openings:
    post:
      operationId: createOpening
      summary: 在墙上开一个门或窗
      description: |
        开口用「墙 + 沿墙偏移」定位：`offset` 是距墙 A 端点的厘米数，
        `offset + width` 不能超过墙长。`height` / `sill` 省略时按类型给默认值
        （门 210/0，窗 120/90）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpeningInput"
      responses:
        "201":
          description: 已创建，返回最新的整份户型
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/openings/{openingId}:
    parameters:
      - name: openingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateOpening
      summary: 调整开口的位置或尺寸
      description: 只改出现的字段；`offset + width` 仍受墙长约束，越界返回 400。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpeningPatch"
      responses:
        "200":
          description: 已保存，返回最新的整份户型
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteOpening
      summary: 删掉一个开口
      description: 幂等：本来就不存在也返回 204。
      responses:
        "204":
          description: 已删除
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/item-types:
    get:
      operationId: listItemTypes
      summary: 列出全部类型模板
      description: |
        返回内置类型与用户新建的类型。能力元数据（`capabilities`）是前端动态表单、
        后端校验、模拟器行为与图标映射的唯一来源。
      responses:
        "200":
          description: 类型模板列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ItemType"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: createItemType
      summary: 新建类型模板（仅管理员）
      description: |
        `key` 是类型的稳定身份，创建后不得重命名。能力项的值域在应用层按元数据校验，
        不写入数据库 CHECK 约束——新增类型不应改表。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemTypeInput"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemType"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/item-types/{key}:
    patch:
      operationId: updateItemType
      summary: 修改类型模板（仅管理员）
      description: |
        `key` 不可修改。只修改 `capabilities` 的结构时，服务端递增 `capabilitiesVersion`。
        `driver` 传空字符串表示清除；省略表示保持不变。
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemTypeUpdate"
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemType"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteItemType
      summary: 删除类型模板（仅管理员）
      description: 仍被物品引用的类型不允许删除，返回 409 并说明引用数量。
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: 已删除
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/items:
    get:
      operationId: listItems
      summary: 列出物品（可按房间、类别、关键字筛选）
      parameters:
        - name: room
          in: query
          required: false
          schema:
            type: string
          description: 房间多边形哈希（来自 /api/plan 的 rooms[].hash）
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [furniture, device]
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: 按名称关键字搜索（不区分大小写）
      responses:
        "200":
          description: 物品列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Item"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: createItem
      summary: 新建物品（家具或设备）
      description: |
        设备会按类型模板的 capabilities 初始化 capability_state；这是物品创建事务的一部分，
        不经过命令链路。房间哈希必须来自当前已命名的房间。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemInput"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/items/{id}:
    patch:
      operationId: updateItem
      summary: 修改物品名称、房间、坐标、旋转或装饰属性
      description: 只更新请求里出现的字段；`roomHash` 传空字符串表示移出房间。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemUpdate"
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteItem
      summary: 删除物品
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: 已删除
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/items/{id}/commands:
    post:
      operationId: sendItemCommand
      summary: 给设备下发一条能力命令
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandInput"
      responses:
        "202":
          description: 模拟设备已成功执行
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: 设备不可用或超时
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/items/{id}/states:
    get:
      operationId: listItemStates
      summary: 读取物品当前能力状态
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 当前能力状态
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CapabilityState"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/items/{id}/history:
    get:
      operationId: listItemHistory
      summary: 按时间倒序读取物品状态变化历史
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: key
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: 状态变化历史
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StateHistory"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/sim/tick:
    post:
      operationId: advanceSimulation
      summary: 推进模拟器指定分钟数
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [minutes]
              additionalProperties: false
              properties:
                minutes:
                  type: integer
                  minimum: 1
                  maximum: 1440
      responses:
        "200":
          description: 环境已演化
          content:
            application/json:
              schema:
                type: object
                required: [minutes, simulatedAt]
                properties:
                  minutes:
                    type: integer
                  simulatedAt:
                    type: string
                    format: date-time
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/sim/env:
    get:
      operationId: getSimEnv
      summary: 获取当前仿真季节与室外环境设定
      responses:
        "200":
          description: 当前仿真环境配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimEnv"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    put:
      operationId: updateSimEnv
      summary: 更新仿真季节与室外温湿度（仅管理员）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimEnvInput"
      responses:
        "200":
          description: 已更新的仿真环境配置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimEnv"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/command-logs:
    get:
      operationId: listCommandLogs
      summary: 按时间倒序列出最近操作记录
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: 操作记录列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommandLog"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/modes:
    get:
      operationId: listModes
      summary: 列出所有场景模式
      responses:
        "200":
          description: 场景列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Mode"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /api/modes/{id}:
    get:
      operationId: getMode
      summary: 获取单个场景模式详情
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 场景详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mode"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/modes/{id}/run:
    post:
      operationId: runMode
      summary: 触发执行指定场景模式
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunModeRequest"
      responses:
        "202":
          description: 场景执行已启动
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/runs/{id}:
    get:
      operationId: getRun
      summary: 获取一次场景执行记录及全部步骤状态
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 执行详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/runs/{id}/cancel:
    post:
      operationId: cancelRun
      summary: 取消正在运行的场景执行
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 已取消的执行记录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: |
        HMAC 签名的不透明会话 Cookie。`httpOnly` + `SameSite=Lax` + `Path=/`，
        前端拿不到也不需要拿它的内容。实时通道复用同一个 Cookie。
  responses:
    Unauthenticated:
      description: 未登录或会话无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidRequest:
      description: 请求体不合法
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: 当前账号无此权限
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: 目标不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: 与现有数据冲突（key 重复、类型仍被引用等）
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    StateHistory:
      type: object
      required: [id, itemId, capabilityKey, value, source, recordedAt]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        itemId:
          type: string
          format: uuid
        capabilityKey:
          type: string
        value: {}
        source:
          type: string
          enum: [manual, automation, device, timeout]
        recordedAt:
          type: string
          format: date-time
    CapabilityState:
      type: object
      required: [itemId, capabilityKey, value, source, updatedAt]
      additionalProperties: false
      properties:
        itemId:
          type: string
          format: uuid
        capabilityKey:
          type: string
        value: {}
        source:
          type: string
          enum: [manual, automation, device, timeout]
        updatedAt:
          type: string
          format: date-time
    CommandInput:
      type: object
      required: [capabilityKey, value, requestId]
      additionalProperties: false
      properties:
        capabilityKey:
          type: string
          minLength: 1
          maxLength: 64
        value: {}
        requestId:
          type: string
          format: uuid
    CommandResult:
      type: object
      required: [requestId, status, value]
      additionalProperties: false
      properties:
        requestId:
          type: string
          format: uuid
        status:
          type: string
          enum: [ok]
        value: {}
    CommandLog:
      type: object
      required: [id, requestId, status, source, createdAt]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        requestId:
          type: string
          format: uuid
        itemId:
          type: string
          format: uuid
        capabilityKey:
          type: string
        target: {}
        status:
          type: string
          enum: [ok, failed, timeout, rejected]
        errorCode:
          type: string
          description: 失败原因码（与命令响应里的 code 一致），成功时缺省
        error:
          type: string
        source:
          type: string
          enum: [manual, automation, device, timeout]
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        durationMs:
          type: integer
    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          examples: [zhang]
        password:
          type: string
          minLength: 1
          maxLength: 256
    SessionUser:
      type: object
      required: [id, username, displayName, role]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [admin, member]
    WallInput:
      type: object
      required: [ax, ay, bx, by]
      additionalProperties: false
      properties:
        ax:
          type: number
          format: double
          minimum: 0
          maximum: 5000
          description: 起点 x，单位厘米，原点在平面图左上角（0–5000，超出会被拒）
        ay:
          type: number
          format: double
          minimum: 0
          maximum: 5000
        bx:
          type: number
          format: double
          minimum: 0
          maximum: 5000
          description: 终点 x（0–5000，超出会被拒）
        by:
          type: number
          format: double
          minimum: 0
          maximum: 5000
        thickness:
          type: number
          format: double
          minimum: 1
          maximum: 100
          default: 10
          description: 墙厚（厘米），省略时为 10
        arcExtent:
          type: number
          format: double
          minimum: -180
          maximum: 180
          default: 0
          description: |
            弧度（度）。0 表示直墙；正负表示往弦的哪一侧弯（逆时针为正）。
            半径与圆心由弦长和弧角反解，不落库。
    Corner:
      type: object
      required: [id, x, y]
      properties:
        id:
          type: string
          format: uuid
        x:
          type: number
          format: double
        y:
          type: number
          format: double
    Wall:
      type: object
      required: [id, aId, bId, ax, ay, bx, by, thickness, arcExtent]
      properties:
        id:
          type: string
          format: uuid
        aId:
          type: string
          format: uuid
          description: 起点端点 id
        bId:
          type: string
          format: uuid
        ax:
          type: number
          format: double
        ay:
          type: number
          format: double
        bx:
          type: number
          format: double
        by:
          type: number
          format: double
        thickness:
          type: number
          format: double
        arcExtent:
          type: number
          format: double
          description: 弧度（度），0 为直墙
    Plan:
      type: object
      required: [corners, walls, openings, rooms, openWalls, staleRooms, version]
      properties:
        corners:
          type: array
          items:
            $ref: "#/components/schemas/Corner"
        walls:
          type: array
          items:
            $ref: "#/components/schemas/Wall"
        openings:
          type: array
          description: |
            门与窗。和挂墙物品一样用「墙 + 沿墙偏移」定位，
            墙移动或改长后偏移不变、世界坐标跟着墙走。
          items:
            $ref: "#/components/schemas/Opening"
        rooms:
          type: array
          description: |
            由墙的闭环推导出来的房间。前端只渲染，不自己推导。
            墙没围成闭环时这里是空数组，`openWalls` 会给出提示依据。
          items:
            $ref: "#/components/schemas/Room"
        openWalls:
          type: integer
          description: 没有参与任何闭合区域的墙数；大于 0 时前端提示「还有墙没围上」
        staleRooms:
          type: array
          description: |
            失配的房间名：墙改过之后，原来那间房的哈希对不上了，名字就悬空在这里。
            前端据此提示「原来给客厅起的名字已失效」，并允许一键清理。
          items:
            $ref: "#/components/schemas/StaleRoom"
        underlay:
          nullable: true
          description: |
            垫在画布下面的底图元数据。没有底图时是 `null`。
            图片字节不在 JSON 里，走 `GET /api/plan/underlay/image`；
            换图、定标、透明度这些改动都不改变户型版本号。
          allOf:
            - $ref: "#/components/schemas/Underlay"
        version:
          type: integer
          format: int64
          description: |
            平面图版本号。每次整份替换成功后 +1，撤销/重做靠它做乐观并发：
            写回时带上旧版本号，服务端发现对不上就返回 409，客户端重新取全量。
    WallSnapshot:
      type: object
      required: [ax, ay, bx, by]
      additionalProperties: false
      description: |
        整份替换时的一面墙。`id` 可省略：省略表示新建（服务端生成），
        带上表示「这面墙原来就在」——撤销/重做必须保住 id，否则门窗的
        `wall_id` 与前端选中态都会断。
      properties:
        id:
          type: string
          format: uuid
        ax:
          type: number
          format: double
          minimum: 0
          maximum: 5000
        ay:
          type: number
          format: double
          minimum: 0
          maximum: 5000
        bx:
          type: number
          format: double
          minimum: 0
          maximum: 5000
        by:
          type: number
          format: double
          minimum: 0
          maximum: 5000
        thickness:
          type: number
          format: double
          minimum: 1
          maximum: 100
          default: 10
        arcExtent:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: 弧度（度），0 为直墙
    PlanInput:
      type: object
      required: [version, walls]
      additionalProperties: false
      description: 整份替换整个户型（撤销/重做用）。
      properties:
        version:
          type: integer
          format: int64
          description: 客户端读到的版本号；与服务端不一致时返回 409
        walls:
          type: array
          items:
            $ref: "#/components/schemas/WallSnapshot"
    PlanPoint:
      type: object
      required: [x, y]
      additionalProperties: false
      properties:
        x:
          type: number
          format: double
        y:
          type: number
          format: double
    Room:
      type: object
      required: [hash, ring, areaM2]
      additionalProperties: false
      description: |
        由墙的闭环推导出来的房间。几何不落库，只把多边形的哈希当作身份：
        墙一改，哈希就变，挂在旧哈希上的名字自然失配（不会把「客厅」挂到卫生间上）。
      properties:
        hash:
          type: string
          description: 多边形顶点规范化后的哈希，房间命名的键
        ring:
          type: array
          description: 闭合多边形的顶点，首尾不重复
          items:
            $ref: "#/components/schemas/PlanPoint"
        areaM2:
          type: number
          format: double
          description: 面积（平方米，两位小数）
        name:
          type: string
          description: 用户起的名字；还没起名时为空
        kind:
          type: string
          enum: [living, bedroom, kitchen, bathroom, study, hallway, balcony]
          description: 房间用途；还没指定时为空
    StaleRoom:
      type: object
      required: [hash, name]
      description: 失配的房间名——哈希已经不属于任何现存房间。
      properties:
        hash:
          type: string
          pattern: "^[0-9a-f]{16}$"
        name:
          type: string
        kind:
          type: string
          enum: [living, bedroom, kitchen, bathroom, study, hallway, balcony]
    RoomNameInput:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 24
          description: 房间名，1–24 个字
        kind:
          type: string
          enum: [living, bedroom, kitchen, bathroom, study, hallway, balcony]
    CapabilityOption:
      type: object
      required: [value, label]
      additionalProperties: false
      properties:
        value:
          type: string
          description: 存进能力值里的机器标识，如 cool
        label:
          type: string
          description: 界面显示的中文名，如 制冷
    Capability:
      type: object
      required: [key, name, type, writable, history]
      additionalProperties: false
      description: |
        能力项是类型级定义，不是实例值。值域校验读这里，不写数据库 CHECK。
      properties:
        key:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,63}$"
          description: 稳定标识，发布后不得重命名
        name:
          type: string
          minLength: 1
          maxLength: 64
        type:
          type: string
          enum: [bool, number, enum, string]
        unit:
          type: string
          description: 单位，如 %、℃、K
        min:
          type: number
          format: double
        max:
          type: number
          format: double
        step:
          type: number
          format: double
          description: 数值步长；省略表示不限制
        options:
          type: array
          description: type=enum 时必填，且不能为空
          items:
            $ref: "#/components/schemas/CapabilityOption"
        writable:
          type: boolean
          description: 用户是否可以下发命令修改
        default:
          description: 默认值；JSON 标量（boolean/number/string），类型必须与 type 一致，枚举必须命中 options
        history:
          type: boolean
          description: 值变化时是否写 state_history
    Underlay:
      type: object
      required: [contentType, widthPx, heightPx, sha256, cmPerPx, offsetXCm, offsetYCm,
                 rotationDeg, opacity, visible, updatedAt]
      additionalProperties: false
      description: |
        底图的元数据。`cmPerPx` 与 `offsetXCm/offsetYCm` 一起定义「图片像素 → 世界厘米」的映射：
        图片左上角落在 `(offsetXCm, offsetYCm)`，每像素宽 `cmPerPx` 厘米，旋转绕图片中心。
      properties:
        contentType:
          type: string
          enum: [image/png, image/jpeg, image/webp]
        widthPx:
          type: integer
        heightPx:
          type: integer
        sha256:
          type: string
          description: 图片字节的摘要，前端可据此判断要不要重新拉图
        cmPerPx:
          type: number
          format: double
          description: 一个像素等于多少厘米；未定标时是上传时按包围盒铺满算出的估计值
        offsetXCm:
          type: number
          format: double
        offsetYCm:
          type: number
          format: double
        rotationDeg:
          type: integer
          enum: [0, 90, 180, 270]
        opacity:
          type: number
          format: double
          minimum: 0.1
          maximum: 1
        visible:
          type: boolean
        updatedAt:
          type: string
          format: date-time
    UnderlayPatch:
      type: object
      additionalProperties: false
      description: 只改出现的字段。
      properties:
        cmPerPx:
          type: number
          format: double
          exclusiveMinimum: 0
        offsetXCm:
          type: number
          format: double
        offsetYCm:
          type: number
          format: double
        rotationDeg:
          type: integer
          enum: [0, 90, 180, 270]
        opacity:
          type: number
          format: double
          minimum: 0.1
          maximum: 1
        visible:
          type: boolean
    Opening:
      type: object
      required: [id, wallId, kind, offset, width, height, sill]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        wallId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [door, window]
        offset:
          type: number
          format: double
          description: 距墙 A 端点的偏移（厘米）
        width:
          type: number
          format: double
        height:
          type: number
          format: double
        sill:
          type: number
          format: double
          description: 离地高度（厘米）；门为 0
    OpeningInput:
      type: object
      required: [wallId, kind, offset, width]
      additionalProperties: false
      properties:
        wallId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [door, window]
        offset:
          type: number
          format: double
          minimum: 0
        width:
          type: number
          format: double
          minimum: 10
          maximum: 500
        height:
          type: number
          format: double
          minimum: 10
          maximum: 500
        sill:
          type: number
          format: double
          minimum: 0
          maximum: 500
    OpeningPatch:
      type: object
      additionalProperties: false
      description: 只改出现的字段。
      properties:
        offset:
          type: number
          format: double
          minimum: 0
        width:
          type: number
          format: double
          minimum: 10
          maximum: 500
        height:
          type: number
          format: double
          minimum: 10
          maximum: 500
        sill:
          type: number
          format: double
          minimum: 0
          maximum: 500
    ItemType:
      type: object
      required: [key, kind, name, defaultWidth, defaultDepth, mount, capabilities, capabilitiesVersion]
      additionalProperties: false
      properties:
        key:
          type: string
          description: 稳定标识，创建后不可重命名
        kind:
          type: string
          enum: [furniture, device]
        name:
          type: string
        icons:
          type: string
          description: 图标名（Lucide 命名空间内）；没有图标时该字段不出现（null）
        defaultWidth:
          type: number
          format: double
          description: 平面图默认宽度（厘米）
        defaultDepth:
          type: number
          format: double
          description: 平面图默认深度（厘米）
        mount:
          type: string
          enum: [floor, wall, ceiling]
          description: |
            默认挂在哪：`floor` 落地、`wall` 贴墙（需 `wallId` + `wallOffset` 定位）、
            `ceiling` 吸顶。窗帘、壁挂空调是 wall，吸顶灯是 ceiling。
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/Capability"
        capabilitiesVersion:
          type: integer
          description: 能力结构版本；capabilities 结构变化时由服务端递增
        driver:
          type: string
          description: 仅 device 可填；指向设备层适配器
    ItemTypeInput:
      type: object
      required: [key, kind, name, capabilities]
      additionalProperties: false
      properties:
        key:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,63}$"
        kind:
          type: string
          enum: [furniture, device]
        name:
          type: string
          minLength: 1
          maxLength: 64
        icons:
          type: string
          description: 图标名（Lucide 命名空间内）；空串与不填等价，表示没有图标
        defaultWidth:
          type: number
          format: double
          minimum: 1
          maximum: 5000
        defaultDepth:
          type: number
          format: double
          minimum: 1
          maximum: 5000
        mount:
          type: string
          enum: [floor, wall, ceiling]
          description: 省略表示 floor
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/Capability"
        driver:
          type: string
    ItemTypeUpdate:
      type: object
      additionalProperties: false
      description: 所有字段可选；capabilities 省略表示不修改能力结构。
      if:
        required: [capabilities]
      then:
        required: [capabilitiesVersion]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        icons:
          type: string
          description: 图标名（Lucide 命名空间内）；空串与不填等价，表示没有图标
        defaultWidth:
          type: number
          format: double
          minimum: 1
          maximum: 5000
        defaultDepth:
          type: number
          format: double
          minimum: 1
          maximum: 5000
        mount:
          type: string
          enum: [floor, wall, ceiling]
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/Capability"
        driver:
          type: string
          description: 省略表示不变；空字符串表示清除
        capabilitiesVersion:
          type: integer
          description: |
            乐观锁版本。修改 `capabilities` 时**必填**（否则 400）；服务端发现已被他人修改时返回 409。
            UI 保存时总是带上，避免用陈旧的能力数组覆盖别人刚加的能力项。
    Item:
      type: object
      required: [id, typeKey, kind, name, x, y, rotation]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        typeKey:
          type: string
        kind:
          type: string
          enum: [furniture, device]
        name:
          type: string
        roomHash:
          type: string
          description: 所属房间的多边形哈希；未分配时省略
        roomName:
          type: string
          description: 房间显示名；房间还没有命名时省略
        x:
          type: number
          format: double
          description: 物品中心点的平面坐标 X（厘米）
        y:
          type: number
          format: double
          description: 物品中心点的平面坐标 Y（厘米）
        rotation:
          type: number
          format: double
          description: 绕物品中心旋转的角度（度，顺时针为正）
        status:
          type: string
          enum: [normal, idle, maintenance]
          description: 仅家具使用；设备状态在 capability_state
        attrs:
          type: object
          additionalProperties: true
        wallId:
          type: string
          format: uuid
          description: 挂在哪面墙上；落地物品省略
        wallOffset:
          type: number
          format: double
          description: 距墙 A 端点的偏移（厘米）；挂墙时与 wallId 同时出现
    ItemInput:
      type: object
      required: [typeKey, name, x, y]
      additionalProperties: false
      properties:
        typeKey:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 64
        roomHash:
          type: string
          description: 仅允许当前已命名的房间
        x:
          type: number
          format: double
          minimum: 0
          maximum: 5000
        y:
          type: number
          format: double
          minimum: 0
          maximum: 5000
        rotation:
          type: number
          format: double
        status:
          type: string
          enum: [normal, idle, maintenance]
        attrs:
          type: object
          additionalProperties: true
        wallId:
          type: string
          format: uuid
          description: |
            挂墙物品给出所在墙的 id。给了墙就以 `wallOffset` 定位，
            `x` / `y` / `rotation` 由服务端按墙算出来，传了也会被覆盖。
            类型 `mount` 为 `wall` 的物品必填，否则 400。
        wallOffset:
          type: number
          format: double
          minimum: 0
          description: 挂墙时必填：距墙 A 端点的偏移（厘米）
    ItemUpdate:
      type: object
      additionalProperties: false
      description: 只更新出现的字段；roomHash 传空字符串表示移出房间。
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        roomHash:
          type: string
        x:
          type: number
          format: double
          minimum: 0
          maximum: 5000
        y:
          type: number
          format: double
          minimum: 0
          maximum: 5000
        rotation:
          type: number
          format: double
        status:
          type: string
          enum: [normal, idle, maintenance]
        attrs:
          type: object
          additionalProperties: true
        wallId:
          type: string
          description: |
            改成挂墙物品；空字符串表示脱离墙面、回到自由摆放。
            `mount` 为 `wall` 的类型不接受空字符串（400）。
        wallOffset:
          type: number
          format: double
          minimum: 0
          description: 与 wallId 一起给出；脱离墙面时忽略
    ModeCondition:
      type: object
      required: [itemId, capability, op, value]
      properties:
        itemId:
          type: string
          format: uuid
        capability:
          type: string
        op:
          type: string
          enum: ["==", "!=", ">", ">=", "<", "<="]
        value: {}
    ModeGuard:
      type: object
      properties:
        all:
          type: array
          items:
            $ref: "#/components/schemas/ModeCondition"
        any:
          type: array
          items:
            $ref: "#/components/schemas/ModeCondition"
    ModeNode:
      type: object
      required: [nodeId, type]
      properties:
        nodeId:
          type: string
          minLength: 1
        type:
          type: string
          enum: [action, delay, choose]
        alias:
          type: string
        enabled:
          type: boolean
        continueOnError:
          type: boolean
        itemId:
          type: string
          format: uuid
        capability:
          type: string
        value: {}
        valueFrom:
          type: string
          enum: [comfort]
        ms:
          type: integer
          minimum: 0
        when:
          $ref: "#/components/schemas/ModeGuard"
        then:
          type: array
          items:
            $ref: "#/components/schemas/ModeNode"
        else:
          type: array
          items:
            $ref: "#/components/schemas/ModeNode"
    ModeDefinition:
      type: object
      required: [version, steps]
      properties:
        version:
          type: integer
          minimum: 1
        guard:
          $ref: "#/components/schemas/ModeGuard"
        defaults:
          type: object
          properties:
            continueOnError:
              type: boolean
        steps:
          type: array
          items:
            $ref: "#/components/schemas/ModeNode"
    Mode:
      type: object
      required: [id, name, definition, runMode, enabled, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        definition:
          $ref: "#/components/schemas/ModeDefinition"
        runMode:
          type: string
          enum: [single, restart, queued, parallel]
        enabled:
          type: boolean
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RunModeRequest:
      type: object
      additionalProperties: false
      properties:
        requestId:
          type: string
          format: uuid
    RunStep:
      type: object
      required: [runId, nodeId, path, status]
      properties:
        runId:
          type: string
          format: uuid
        nodeId:
          type: string
        path:
          type: string
        alias:
          type: string
        status:
          type: string
          enum: [pending, running, ok, failed, skipped]
        error:
          type: string
        note:
          type: string
          description: 步骤执行的可读说明或策略调节依据文案
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
    Run:
      type: object
      required: [id, status, source, startedAt, steps]
      properties:
        id:
          type: string
          format: uuid
        modeId:
          type: string
          format: uuid
        status:
          type: string
          enum: [running, ok, failed, cancelled]
        source:
          type: string
          enum: [manual, automation, device, timeout]
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        reason:
          type: string
          description: 顶层守卫未满足、超时或中止时的可读原因
        steps:
          type: array
          items:
            $ref: "#/components/schemas/RunStep"
    SimEnvInput:
      type: object
      required: [season]
      additionalProperties: false
      properties:
        season:
          type: string
          enum: [auto, spring, summer, autumn, winter]
        outdoorTemp:
          type: number
          format: double
          minimum: -40
          maximum: 60
        outdoorHumidity:
          type: number
          format: double
          minimum: 0
          maximum: 100
    SimEnv:
      type: object
      required: [season, effectiveSeason]
      properties:
        season:
          type: string
          enum: [auto, spring, summer, autumn, winter]
        effectiveSeason:
          type: string
          enum: [spring, summer, autumn, winter]
        outdoorTemp:
          type: number
          format: double
        outdoorHumidity:
          type: number
          format: double
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: |
                机器可读的错误码。本版只用到前三个，其余是后续票的预留：
                UNAUTHENTICATED、VALIDATION_FAILED、INTERNAL、
                FORBIDDEN、NOT_FOUND、RANGE_OUT_OF_BOUNDS、
                CONFLICT、ROOM_NOT_CLOSED、DEVICE_UNAVAILABLE、DEVICE_TIMEOUT、
                IMPORT_VALIDATION_FAILED
              enum:
                - UNAUTHENTICATED
                - VALIDATION_FAILED
                - INTERNAL
                - FORBIDDEN
                - NOT_FOUND
                - RANGE_OUT_OF_BOUNDS
                - CONFLICT
                - ROOM_NOT_CLOSED
                - DEVICE_UNAVAILABLE
                - DEVICE_TIMEOUT
                - IMPORT_VALIDATION_FAILED
            message:
              type: string
security:
  - cookieAuth: []
